name: bnn-stages
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python=3.10

  # Conda-installable scientific stack
  - numpy=1.25.0
  - scipy=1.13.1
  - pandas=2.2.2
  - h5py=3.10.0
  - mne=1.9.0
  - matplotlib=3.7.1
  - scikit-learn=1.5.1
  - nilearn=0.11.1
  - tqdm=4.66.4
  - pillow=9.5.0
  - ipykernel>=6.25.0

  # PyTorch (CPU version from conda)
  - pytorch=2.2.1
  - torchvision=0.17.1
  - torchaudio=2.2.1

  # pip-only packages
  - pip
  - pip:
      - torchmetrics==1.3.1
      - torch-geometric==2.6.1
      - snntorch==0.9.1
      - torchdiffeq==0.2.5
      - torcheval==0.0.7
      - pytorch-lightning==2.4.0
      - xgboost==2.1.1
      - lightgbm==4.3.0
      - fastai==2.7.16
      - imbalanced-learn==0.10.1
      - jaxtyping==0.2.20
      - zanj==0.2.0
      - muutils==0.5.1
      - seaborn==0.12.2
      - plotly==5.20.0
      - bokeh==2.5.3
      - datasets==2.20.0
      - albumentations==1.4.11
      - typing-extensions==4.10.0
      - h5io==0.1.9
